# Продакшн. Отличия от docker-compose.yml:
#   · наружу смотрит только веб-контейнер, и то на 127.0.0.1 — снаружи к нему
#     не подключиться, запросы приходят через СИСТЕМНЫЙ nginx сервера;
#   · порты базы и бэкенда не публикуются вообще;
#   · исходники не монтируются — код запечён в образ, правки требуют пересборки.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: finasist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нужен .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: finasist_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}

  frontend:
    build: ./frontend
    container_name: finasist_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # только localhost: снаружи порт закрыт, наружу выводит системный nginx
    ports:
      - "127.0.0.1:${WEB_PORT:-5181}:80"

volumes:
  pgdata:
