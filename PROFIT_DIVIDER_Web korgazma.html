<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROFIT DIVIDER — Kunlik moliyaviy hisobot</title>
<style>
:root{
  --ink:#12161c; --ink-2:#39424f; --ink-3:#6b7684;
  --paper:#f7f6f3; --card:#ffffff; --line:#dfdcd4;
  --accent:#1c5d4a; --accent-2:#2a8368; --warn:#a8541c; --bad:#9b2c2c;
  --grid:#eeece6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.45 "Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.015em}
.mono{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;
  align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header .brand{font-size:16px;font-weight:700;letter-spacing:.02em}
header .brand span{color:#8fd4bb;font-weight:500}
header .spacer{flex:1}
header select,header input{background:#212934;color:#fff;border:1px solid #39424f;
  border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit}

nav{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);
  padding:0 12px;overflow-x:auto;position:sticky;top:57px;z-index:40}
nav button{background:none;border:0;border-bottom:2.5px solid transparent;padding:12px 14px;
  font:inherit;font-size:13px;font-weight:560;color:var(--ink-3);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}

main{padding:20px;max-width:1500px;margin:0 auto}
.page{display:none} .page.on{display:block}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:20px}
.head p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.head .spacer{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:16px;margin-bottom:16px}
.card>h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);margin-bottom:12px;font-weight:640}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  border-left:3px solid var(--accent)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:21px;font-weight:680;margin-top:5px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi.neg{border-left-color:var(--bad)} .kpi.neg .v{color:var(--bad)}
.kpi.pos .v{color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--grid);text-align:left;padding:8px 10px;font-weight:640;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:#fbfaf7}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono",Consolas,monospace}
tr.total{background:#f0f4f2;font-weight:680}
tr.total td{border-top:1.5px solid var(--accent);border-bottom:0}
tr.grp td{background:#eef1f0;font-weight:660;font-size:12px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.scroll{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:9px}
.scroll table{font-size:12.5px}

.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 15px;
  font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-2)}
.btn.g{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.g:hover{background:var(--grid)}
.btn.r{background:#fff;color:var(--bad);border:1px solid #e4c4c4}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px}
.f label{display:block;font-size:11px;font-weight:640;color:var(--ink-2);
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.f input,.f select{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;font:inherit;font-size:13px;background:#fff}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.f input[readonly]{background:var(--grid);color:var(--ink-2)}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:640}
.pill.in{background:#e0f0e8;color:#1a6b4f} .pill.out{background:#fae5dd;color:#9b4a20}
.empty{padding:36px;text-align:center;color:var(--ink-3);font-size:13px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.bar{height:7px;background:var(--grid);border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tag{font-size:11px;padding:1px 6px;background:var(--grid);border-radius:4px;color:var(--ink-2)}
@media(max-width:640px){main{padding:12px}.kpi .v{font-size:18px}}
</style>
</head>

</header>

const $=id=>document.getElementById(id);
const num=v=>{const n=parseFloat(String(v??'').replace(/\s|,/g,''));return isFinite(n)?n:0};
function fmt(v,d=0){if(!isFinite(v))v=0;
  return v.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtU(v){return fmt(v,0)}
function usd(v){return fmt(S.rate?v/S.rate:0,2)}

function cur(arr){return (arr||[]).filter(inMonth)}

/* ============ CALC ENGINE ============ */

/* --- Savdo / Revenue --- */
function calcSales(){
  const rows=cur(S.sales);
  let g=0,vat=0,net=0,qty=0;
  rows.forEach(r=>{
    const amt=num(r.qty)*num(r.price);
    const v=r.vat==='ndsli'?amt-amt/(1+NDS):0;
    g+=amt; vat+=v; net+=amt-v; qty+=num(r.qty);
  });
  return {gross:g,vat:vat,net:net,qty:qty,rows:rows};
}

/* --- Xarajatlar / Expenses from bank+kassa by code --- */
function expenseByCode(){
  const m={};
  const add=(code,uzs)=>{if(!code)return;m[code]=(m[code]||0)+uzs};
  cur(S.bank).forEach(r=>{if(num(r.out)>0)add(r.ecode,num(r.out))});
  cur(S.kassa).forEach(r=>{if(num(r.out)>0)add(r.ecode,num(r.out))});
  return m;
}
function expenseGroups(){
  const m=expenseByCode();
  const g={prod:0,sell:0,admin:0,other:0};
  for(const c in m){
    const v=m[c];
    if(c.startsWith('20'))g.prod+=v;
    else if(c.startsWith('941'))g.sell+=v;
    else if(c.startsWith('942'))g.admin+=v;
    else if(c.startsWith('943'))g.other+=v;
  }
  g.period=g.sell+g.admin+g.other;
  g.total=g.prod+g.period;
  return g;
}

/* --- Xomashyo / Raw material movement --- */
function matBalance(){
  const map={};
  REF.materials.forEach(x=>map[x.code]={code:x.code,name:x.name,unit:x.unit,
    oq:0,ov:0,iq:0,iv:0,oq2:0,ov2:0});
  (S.openStock||[]).forEach(r=>{const t=map[r.code];if(t){t.oq+=num(r.qty);t.ov+=num(r.val)}});
  cur(S.matIn).forEach(r=>{const t=map[r.code];if(t){t.iq+=num(r.qty);t.iv+=num(r.qty)*num(r.price)}});
  cur(S.matOut).forEach(r=>{const t=map[r.code];if(t){t.oq2+=num(r.qty);
    const avg=(t.oq+t.iq)?(t.ov+t.iv)/(t.oq+t.iq):0; t.ov2+=num(r.qty)*avg}});
  return Object.values(map).map(t=>({...t,
    cq:t.oq+t.iq-t.oq2, cv:t.ov+t.iv-t.ov2,
    avg:(t.oq+t.iq)?(t.ov+t.iv)/(t.oq+t.iq):0}));
}

/* --- Tannarx / COGS --- */
function calcCOGS(){
  const mat=matBalance();
  const matUsed=mat.reduce((s,x)=>s+x.ov2,0);
  const g=expenseGroups();
  const total=matUsed+g.prod;
  const prodQty=cur(S.prod).reduce((s,r)=>s+num(r.qty),0);
  return {matUsed,prodExp:g.prod,total,prodQty,perUnit:prodQty?total/prodQty:0};
}

/* --- Tayyor mahsulot / Finished goods --- */
function fgBalance(){
  const map={};
  REF.products.forEach(p=>map[p.code]={code:p.code,name:p.name,unit:p.unit,
    inq:0,outq:0,rev:0});
  cur(S.prod).forEach(r=>{const t=map[r.code];if(t)t.inq+=num(r.qty)});
  cur(S.sales).forEach(r=>{const t=map[r.code];if(t){t.outq+=num(r.qty);
    const a=num(r.qty)*num(r.price);t.rev+=r.vat==='ndsli'?a/(1+NDS):a}});
  const c=calcCOGS();
  return Object.values(map).map(t=>({...t,
    bal:t.inq-t.outq, cost:t.outq*c.perUnit,
    profit:t.rev-t.outq*c.perUnit,
    avgPrice:t.outq?t.rev/t.outq:0}));
}

/* --- OFR / P&L --- */
function calcPL(){
  const s=calcSales(), c=calcCOGS(), g=expenseGroups();
  const cogs=fgBalance().reduce((a,x)=>a+x.cost,0);
  const gross=s.net-cogs;
  const opProfit=gross-g.period;
  const tax=opProfit>0?opProfit*0.15:0;
  return {revenue:s.net,vat:s.vat,cogs,gross,
    sell:g.sell,admin:g.admin,other:g.other,period:g.period,
    opProfit,tax,net:opProfit-tax,
    margin:s.net?gross/s.net*100:0,
    netMargin:s.net?(opProfit-tax)/s.net*100:0};
}

/* --- Cash flow --- */
function cashFlow(){
  const bIn=cur(S.bank).reduce((a,r)=>a+num(r.in),0);
  const bOut=cur(S.bank).reduce((a,r)=>a+num(r.out),0);
  const kIn=cur(S.kassa).reduce((a,r)=>a+num(r.in),0);
  const kOut=cur(S.kassa).reduce((a,r)=>a+num(r.out),0);
  const ob=num((S.openCash||{}).bank), ok=num((S.openCash||{}).kassa);
  return {bIn,bOut,kIn,kOut,ob,ok,
    bEnd:ob+bIn-bOut, kEnd:ok+kIn-kOut,
    totIn:bIn+kIn,totOut:bOut+kOut,
    start:ob+ok, end:ob+ok+bIn+kIn-bOut-kOut};
}
function cfByCode(){
  const m={};
  const add=(c,inV,outV)=>{if(!c)c='—';
    m[c]=m[c]||{in:0,out:0}; m[c].in+=inV; m[c].out+=outV};
  cur(S.bank).forEach(r=>add(r.ccode,num(r.in),num(r.out)));
  cur(S.kassa).forEach(r=>add(r.ccode,num(r.in),num(r.out)));
  return m;
}

/* --- Debitor / Kreditor --- */
function ledger(kind){
  const src=kind==='ar'?S.ar:S.ap;
  const map={};
  (src||[]).forEach(r=>{
    const k=r.org||'—';
    map[k]=map[k]||{org:k,ob:0,dt:0,kt:0};
    if(Number(r.m)<S.month)map[k].ob+=num(r.dt)-num(r.kt);
    else if(Number(r.m)===S.month){map[k].dt+=num(r.dt);map[k].kt+=num(r.kt)}
  });
  return Object.values(map).map(x=>({...x,end:x.ob+x.dt-x.kt}))
    .filter(x=>x.ob||x.dt||x.kt);
}

/* --- Balans --- */
function calcBalance(){
  const cf=cashFlow();
  const mat=matBalance().reduce((a,x)=>a+x.cv,0);
  const arT=ledger('ar').reduce((a,x)=>a+Math.max(x.end,0),0);
  const apT=ledger('ap').reduce((a,x)=>a+Math.max(-x.end,0),0);
  const pl=calcPL();
  const assets=cf.end+mat+arT;
  return {cash:cf.end,mat,ar:arT,assets,ap:apT,
    equity:assets-apT,profit:pl.net};
}

/* --- Division split (Распределение) --- */
function divisionSplit(){
  const rows=[];
  DIVS.forEach(d=>{
    const rev=cur(S.sales).filter(r=>r.div===d)
      .reduce((a,r)=>{const x=num(r.qty)*num(r.price);return a+(r.vat==='ndsli'?x/(1+NDS):x)},0);
    const exp=[...cur(S.bank),...cur(S.kassa)].filter(r=>r.div===d)
      .reduce((a,r)=>a+num(r.out),0);
    const qty=cur(S.sales).filter(r=>r.div===d).reduce((a,r)=>a+num(r.qty),0);
    if(rev||exp)rows.push({div:d,rev,exp,profit:rev-exp,qty,
      margin:rev?(rev-exp)/rev*100:0});
  });
  return rows;
}

/* --- Oylik trend --- */
function trend(){
  const keep=S.month; const out=[];
  for(let m=1;m<=12;m++){
    S.month=m;
    const pl=calcPL();
    out.push({m,rev:pl.revenue,cogs:pl.cogs,exp:pl.period,profit:pl.net});
  }
  S.month=keep; return out;
}

function grid(key,cols,rows){
  const h=cols.map(c=>`<th class="${c.type==='n'?'n':''}">${c.label}</th>`).join('');
  const body=rows.length?rows.map((r,i)=>{
    const idx=S[key].indexOf(r);
    return `<tr>`+cols.map(c=>{
      if(c.calc)return `<td class="n">${fmtU(c.calc(r))}</td>`;
      const v=esc(r[c.k]??'');
      if(c.opts)return `<td><select onchange="upd('${key}',${idx},'${c.k}',this.value)"
        style="width:100%;border:0;background:none;font:inherit;padding:2px">
        ${c.opts().map(o=>`<option ${o.v==r[c.k]?'selected':''} value="${esc(o.v)}">${esc(o.t)}</option>`).join('')}
        </select></td>`;
      return `<td class="${c.type==='n'?'n':''}"><input value="${v}"
        type="${c.type==='n'?'number':c.type==='d'?'date':'text'}"
        oninput="upd('${key}',${idx},'${c.k}',this.value)"
        style="width:100%;border:0;background:none;font:inherit;padding:2px;
        ${c.type==='n'?'text-align:right;font-family:ui-monospace':''}"></td>`;
    }).join('')+`<td style="width:34px"><button class="btn r sm"
      onclick="del('${key}',${idx})">✕</button></td></tr>`;
  }).join(''):`<tr><td colspan="${cols.length+1}" class="empty">
    Bu oy uchun yozuv yo'q. "Qator qo'shish" tugmasini bosing.</td></tr>`;
  return `<div class="scroll"><table><thead><tr>${h}<th></th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

   ${kpi('Davr xarajati',fmtU(pl.period),'sotuv+admin+boshqa')}
   ${kpi('Sof foyda',fmtU(pl.net),fmt(pl.netMargin,1)+'% · $'+usd(pl.net),pl.net<0?'neg':'pos')}
   ${kpi('Pul qoldiq',fmtU(cf.end),'bank '+fmtU(cf.bEnd)+' · kassa '+fmtU(cf.kEnd))}

     <td class="n">${fmtU(x.cogs)}</td><td class="n">${fmtU(x.exp)}</td>

    <td class="n">${fmtU(rows.reduce((a,r)=>a+r.exp,0))}</td>
    <td class="n">${fmtU(rows.reduce((a,r)=>a+r.profit,0))}</td><td></td><td></td></tr>
   </tbody></table>`;
}
function vDiv(){
  return head('Bo\'linmalar bo\'yicha taqsimot','Tushum va xarajatlar bo\'linmalar kesimida')
   +`<div class="card">${divTable()}</div>`;
}

/* ============ REFERENCE ============ */
function vRef(){
  const t=(title,rows,cols)=>`<div class="card"><h3>${title} (${rows.length})</h3>
   <div class="scroll" style="max-height:340px"><table><thead><tr>
   ${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>
   ${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[1](r))}</td>`).join('')}</tr>`).join('')}
   </tbody></table></div></div>`;
  return head('Ma\'lumotnomalar','Excel faylidan olingan kodlar va ro\'yxatlar',
    `<button class="btn g" onclick="reseed()">Namuna ma'lumotni tiklash</button>
    <button class="btn g" onclick="wipe()">Hammasini tozalash</button>`)
  +t('Xarajat kodlari',REF.expenseCodes,[['Kod',r=>r.code],['Nomi',r=>r.name]])
  +t('Cash flow kodlari',REF.cashflowCodes,[['Kod',r=>r.code],['Nomi',r=>r.name]])
  +t('Tashkilotlar reestri',REF.orgs,[['INN',r=>r.inn],['Nomi',r=>r.name],
     ['Guruh',r=>r.group],['NDS',r=>r.vat]])
  +t('Tayyor mahsulot',REF.products,[['Kod',r=>r.code],['Nomi',r=>r.name],['O\'lchov',r=>r.unit]])
  +t('Xomashyo',REF.materials,[['Kod',r=>r.code],['Nomi',r=>r.name],['O\'lchov',r=>r.unit]]);
}
function reseed(){if(confirm("Joriy ma'lumot namuna ma'lumot bilan almashtiriladi. Davom etamizmi?")){
  Object.assign(S,JSON.parse(JSON.stringify(DEMO)));save();render()}}
function wipe(){if(confirm("Barcha kiritilgan ma'lumot o'chiriladi. Davom etamizmi?")){
  localStorage.removeItem(K);location.reload()}}

/* ============ EXPORT ============ */
function doExport(){
  const pl=calcPL(),cf=cashFlow(),c=calcCOGS();
  const L=[];
  const push=(...a)=>L.push(a.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';'));
  push('PROFIT DIVIDER — '+MONTHS[S.month-1]+' '+S.year);
  push('');push('OFR','UZS','USD');
  push('Sof tushum',pl.revenue,pl.revenue/S.rate);
  push('Tannarx',pl.cogs,pl.cogs/S.rate);
  push('Yalpi foyda',pl.gross,pl.gross/S.rate);
  push('Davr xarajatlari',pl.period,pl.period/S.rate);
  push('Sof foyda',pl.net,pl.net/S.rate);
  push('');push('CASH FLOW');
  push('Davr boshi',cf.start);push('Kirim',cf.totIn);
  push('Chiqim',cf.totOut);push('Davr oxiri',cf.end);
  push('');push('BANK');push('Sana','Kontragent','Izoh','Kirim','Chiqim','Kod');
  cur(S.bank).forEach(r=>push(r.d,r.org,r.note,num(r.in),num(r.out),r.ecode));
  push('');push('KASSA');push('Sana','Kassa','Kontragent','Izoh','Kirim','Chiqim','Kod');
  cur(S.kassa).forEach(r=>push(r.d,r.cash,r.org,r.note,num(r.in),num(r.out),r.ecode));
  push('');push('SOTUV');push('Sana','Xaridor','Mahsulot','Miqdor','Narx','Summa');
  cur(S.sales).forEach(r=>push(r.d,r.org,
    (REF.products.find(p=>p.code==r.code)||{}).name,num(r.qty),num(r.price),
    num(r.qty)*num(r.price)));
  const blob=new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`PROFIT_DIVIDER_${MONTHS[S.month-1]}_${S.year}.csv`;a.click();
}

boot();
